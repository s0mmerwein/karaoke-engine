<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Karaoke Projector</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://www.youtube.com" />
    <link rel="preconnect" href="https://i.ytimg.com" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="player"></div>

    <div id="idle-screen" class="idle-screen visible" aria-hidden="true">
      <div class="idle-inner">
        <div class="idle-title">Karaoke Flow</div>
        <div class="idle-subtitle">Waiting for the next song…</div>
      </div>
    </div>

    <div id="now-playing" class="now-playing" aria-hidden="true">
      <span class="now-playing-label">Now singing</span>
      <span id="now-playing-text" class="now-playing-text"></span>
    </div>

    <div id="overlay">
      <div class="overlay-ticket-row">
        <div id="ticket-power" class="ticket ticket-power" data-slot="power">
          <div class="ticket-inner">
            <div class="ticket-key">1</div>
            <div class="ticket-label">Power</div>
            <div class="ticket-title">–</div>
            <div class="ticket-artist">–</div>
          </div>
        </div>
        <div
          id="ticket-emotional"
          class="ticket ticket-emotional"
          data-slot="emotional"
        >
          <div class="ticket-inner">
            <div class="ticket-key">2</div>
            <div class="ticket-label">Emotional</div>
            <div class="ticket-title">–</div>
            <div class="ticket-artist">–</div>
          </div>
        </div>
        <div
          id="ticket-evergreen"
          class="ticket ticket-evergreen"
          data-slot="evergreen"
        >
          <div class="ticket-inner">
            <div class="ticket-key">3</div>
            <div class="ticket-label">Evergreen</div>
            <div class="ticket-title">–</div>
            <div class="ticket-artist">–</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Shared BroadcastChannel helpers + page controller -->
    <script src="logic.js"></script>
    <script src="projector.js"></script>

    <!-- YouTube IFrame API (async: projector.js defines the ready callback) -->
    <script src="https://www.youtube.com/iframe_api" async></script>
  </body>
</html>
