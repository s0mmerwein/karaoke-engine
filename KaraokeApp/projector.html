<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Karaoke Projector</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="player"></div>

    <div id="overlay">
      <div class="overlay-ticket-row">
        <div
          id="ticket-power"
          class="ticket ticket-power"
          data-slot="power"
        >
          <div class="ticket-inner">
            <div class="ticket-key">1</div>
            <div class="ticket-label">Power</div>
            <div class="ticket-title">–</div>
            <div class="ticket-artist">–</div>
          </div>
        </div>
        <div
          id="ticket-emotional"
          class="ticket ticket-emotional"
          data-slot="emotional"
        >
          <div class="ticket-inner">
            <div class="ticket-key">2</div>
            <div class="ticket-label">Emotional</div>
            <div class="ticket-title">–</div>
            <div class="ticket-artist">–</div>
          </div>
        </div>
        <div
          id="ticket-evergreen"
          class="ticket ticket-evergreen"
          data-slot="evergreen"
        >
          <div class="ticket-inner">
            <div class="ticket-key">3</div>
            <div class="ticket-label">Evergreen</div>
            <div class="ticket-title">–</div>
            <div class="ticket-artist">–</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Shared BroadcastChannel helpers -->
    <script src="logic.js"></script>
    <!-- Vibe catalogue + offline fallback classifier -->
    <script src="vibes.js"></script>

    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
      let player = null;
      let playerReady = false;
      let pendingVideoId = null;

      function createPlayer() {
        player = new YT.Player("player", {
          width: "100%",
          height: "100%",
          videoId: "",
          playerVars: {
            autoplay: 0,
            controls: 0,
            modestbranding: 1,
            rel: 0,
            showinfo: 0,
            fs: 0,
          },
          events: {
            onReady: onPlayerReady,
          },
        });
      }

      function onPlayerReady() {
        playerReady = true;
        if (pendingVideoId) {
          player.loadVideoById(pendingVideoId);
          player.playVideo();
          pendingVideoId = null;
        }
      }

      // Called automatically by the YouTube IFrame API once it's ready.
      function onYouTubeIframeAPIReady() {
        createPlayer();
      }

      // Ticket / overlay helpers
      const ticketEls = {};

      // --- Vibe animation engine -------------------------------------
      // Each visible ticket plays a subtle animation matching its song's
      // vibe roughly every 30 seconds, randomized per card so they never
      // fire in sync. The chosen (locked) card additionally gets a pop +
      // continuous breathing glow (pure CSS on .locked / .locked-pop).
      const vibeTimers = {};
      const vibeClearTimers = {};
      const currentSlotSongs = {};
      let vibesById = {};

      const ALL_VIBE_CLASSES = window.KaraokeVibes
        ? Object.keys(window.KaraokeVibes.VIBES).map((v) => "vibe-" + v)
        : [];

      function resolveVibe(song) {
        if (!song) return null;
        // Freshest first: the admin broadcasts AI results after load, so
        // the map wins over whatever vibe the payload carried at the time.
        if (song.id != null && vibesById[song.id]) return vibesById[song.id];
        if (song.vibe) return song.vibe;
        return window.KaraokeVibes
          ? window.KaraokeVibes.heuristicVibe(song)
          : null;
      }

      function clearVibeAnimation(el) {
        if (!el) return;
        window.clearTimeout(vibeClearTimers[el.id]);
        el.classList.remove("vibe-anim");
        ALL_VIBE_CLASSES.forEach((cls) => el.classList.remove(cls));
      }

      function playVibeAnimation(slot) {
        const el = ticketEls[slot];
        if (!el || !el.classList.contains("visible")) return;
        const vibe = el.dataset.vibe;
        if (!vibe) return;

        clearVibeAnimation(el);
        const def = window.KaraokeVibes && window.KaraokeVibes.VIBES[vibe];
        const duration = (def && def.duration) || 3500;
        el.style.setProperty("--vibe-duration", duration + "ms");
        el.classList.add("vibe-anim", "vibe-" + vibe);
        vibeClearTimers[el.id] = window.setTimeout(() => {
          el.classList.remove("vibe-anim", "vibe-" + vibe);
        }, duration + 100);
      }

      function scheduleVibeAnimation(slot, isFirst) {
        window.clearTimeout(vibeTimers[slot]);
        const delay = isFirst
          ? 6000 + Math.random() * 14000
          : 22000 + Math.random() * 16000;
        vibeTimers[slot] = window.setTimeout(() => {
          playVibeAnimation(slot);
          scheduleVibeAnimation(slot, false);
        }, delay);
      }

      function stopVibeAnimation(slot) {
        window.clearTimeout(vibeTimers[slot]);
        delete vibeTimers[slot];
        clearVibeAnimation(ticketEls[slot]);
      }

      function setSlotSong(slot, song) {
        const el = ticketEls[slot];
        if (!el) return;
        if (song) {
          currentSlotSongs[slot] = song;
          const vibe = resolveVibe(song);
          if (vibe) {
            el.dataset.vibe = vibe;
          } else {
            delete el.dataset.vibe;
          }
        } else {
          delete currentSlotSongs[slot];
          delete el.dataset.vibe;
        }
      }

      function applyVibeMap(vibes) {
        vibesById = vibes || {};
        Object.entries(currentSlotSongs).forEach(([slot, song]) => {
          const el = ticketEls[slot];
          const vibe = resolveVibe(song);
          if (el && vibe) el.dataset.vibe = vibe;
        });
      }
      // ---------------------------------------------------------------

      function initTickets() {
        ["power", "emotional", "evergreen"].forEach((slot) => {
          const el = document.getElementById("ticket-" + slot);
          if (el) {
            ticketEls[slot] = el;
          }
        });
        hideAllTickets();
      }

      function hideAllTickets() {
        Object.entries(ticketEls).forEach(([slot, el]) => {
          stopVibeAnimation(slot);
          setSlotSong(slot, null);
          el.classList.remove("visible", "locked", "locked-pop");
          el.classList.add("hidden");
          const titleEl = el.querySelector(".ticket-title");
          const artistEl = el.querySelector(".ticket-artist");
          if (titleEl) titleEl.textContent = "–";
          if (artistEl) artistEl.textContent = "–";
        });
      }

      function showOptions(payload) {
        const { power, emotional, evergreen } = payload || {};
        const bySlot = { power, emotional, evergreen };

        Object.entries(bySlot).forEach(([slot, song]) => {
          const el = ticketEls[slot];
          if (!el) return;

          el.classList.remove("locked", "locked-pop", "hidden");
          if (song) {
            const titleEl = el.querySelector(".ticket-title");
            const artistEl = el.querySelector(".ticket-artist");
            if (titleEl) titleEl.textContent = song.title || "";
            if (artistEl) artistEl.textContent = song.artist || "";
            el.classList.add("visible");
            setSlotSong(slot, song);
            scheduleVibeAnimation(slot, true);
          } else {
            stopVibeAnimation(slot);
            setSlotSong(slot, null);
            el.classList.remove("visible");
            el.classList.add("hidden");
          }
        });
      }

      function lockChoice(payload) {
        const { slot, song } = payload || {};
        if (!slot || !ticketEls[slot]) return;

        Object.entries(ticketEls).forEach(([key, el]) => {
          if (key === slot) {
            el.classList.add("locked");
            el.classList.remove("hidden");
            el.classList.add("visible");

            // If song details are provided, ensure the ticket text matches
            // the locked choice (works for both suggestion-based and
            // manually forced selections).
            if (song) {
              const titleEl = el.querySelector(".ticket-title");
              const artistEl = el.querySelector(".ticket-artist");
              if (titleEl) titleEl.textContent = song.title || "";
              if (artistEl) artistEl.textContent = song.artist || "";
              setSlotSong(key, song);
            }

            // Celebration pop for the chosen card; its subtle vibe
            // animations keep running while the audience watches.
            el.classList.remove("locked-pop");
            void el.offsetWidth; // restart the pop animation if re-locked
            el.classList.add("locked-pop");
            window.setTimeout(() => el.classList.remove("locked-pop"), 1000);
            scheduleVibeAnimation(key, true);
          } else {
            stopVibeAnimation(key);
            setSlotSong(key, null);
            el.classList.remove("locked", "locked-pop");
            el.classList.remove("visible");
            el.classList.add("hidden");
          }
        });

        // Optional: could play a sound effect here.
      }

      function playSong(payload) {
        const youtubeId = payload && payload.youtubeId;
        if (!youtubeId) return;

        // Hide tickets while song plays
        Object.entries(ticketEls).forEach(([slot, el]) => {
          stopVibeAnimation(slot);
          setSlotSong(slot, null);
          el.classList.remove("visible", "locked", "locked-pop");
          el.classList.add("hidden");
        });

        if (playerReady && player && typeof player.loadVideoById === "function") {
          player.loadVideoById(youtubeId);
          player.playVideo();
        } else {
          pendingVideoId = youtubeId;
        }
      }

      function handleMessage(msg) {
        if (!msg || !msg.action) return;
        const action = msg.action;
        const payload = msg.payload || {};

        switch (action) {
          case "SHOW_OPTIONS":
            showOptions(payload);
            break;
          case "HIDE_OPTIONS":
            hideAllTickets();
            break;
          case "LOCK_CHOICE":
            lockChoice(payload);
            break;
          case "PLAY_SONG":
            playSong(payload);
            break;
          case "SET_VIBES":
            // Silent update from the admin once AI classification finishes.
            applyVibeMap(payload.vibes);
            break;
          default:
            break;
        }
      }

      function setupKeyboard() {
        window.addEventListener("keydown", (ev) => {
          const key = ev.key;
          if (key === "1" || key === "2" || key === "3") {
            if (window.sendKaraokeMessage) {
              window.sendKaraokeMessage("AUDIENCE_KEY", { key });
            }
          }
        });
      }

      window.addEventListener("DOMContentLoaded", () => {
        initTickets();
        setupKeyboard();
        if (window.onKaraokeMessage) {
          window.onKaraokeMessage(handleMessage);
        }
      });
    </script>
  </body>
</html>
