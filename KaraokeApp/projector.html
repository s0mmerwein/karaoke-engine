<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Karaoke Projector</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="player"></div>

    <div id="overlay">
      <div class="overlay-ticket-row">
        <div
          id="ticket-power"
          class="ticket ticket-power"
          data-slot="power"
        >
          <div class="ticket-inner">
            <div class="ticket-key">1</div>
            <div class="ticket-label">Power</div>
            <div class="ticket-title">–</div>
            <div class="ticket-artist">–</div>
          </div>
        </div>
        <div
          id="ticket-emotional"
          class="ticket ticket-emotional"
          data-slot="emotional"
        >
          <div class="ticket-inner">
            <div class="ticket-key">2</div>
            <div class="ticket-label">Emotional</div>
            <div class="ticket-title">–</div>
            <div class="ticket-artist">–</div>
          </div>
        </div>
        <div
          id="ticket-evergreen"
          class="ticket ticket-evergreen"
          data-slot="evergreen"
        >
          <div class="ticket-inner">
            <div class="ticket-key">3</div>
            <div class="ticket-label">Evergreen</div>
            <div class="ticket-title">–</div>
            <div class="ticket-artist">–</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Shared BroadcastChannel helpers -->
    <script src="logic.js"></script>

    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
      let player = null;
      let playerReady = false;
      let pendingVideoId = null;

      function createPlayer() {
        player = new YT.Player("player", {
          width: "100%",
          height: "100%",
          videoId: "",
          playerVars: {
            autoplay: 0,
            controls: 0,
            modestbranding: 1,
            rel: 0,
            showinfo: 0,
            fs: 0,
          },
          events: {
            onReady: onPlayerReady,
          },
        });
      }

      function onPlayerReady() {
        playerReady = true;
        if (pendingVideoId) {
          player.loadVideoById(pendingVideoId);
          player.playVideo();
          pendingVideoId = null;
        }
      }

      // Called automatically by the YouTube IFrame API once it's ready.
      function onYouTubeIframeAPIReady() {
        createPlayer();
      }

      // Ticket / overlay helpers
      const ticketEls = {};

      // Ambient vibe animations: each visible card plays a subtle,
      // randomly picked animation from its category's pool roughly
      // every 30 seconds (jittered so cards never move in sync).
      const VIBE_POOLS = {
        power: ["vibe-power-surge", "vibe-power-rumble", "vibe-power-flicker"],
        emotional: [
          "vibe-emotional-sway",
          "vibe-emotional-breathe",
          "vibe-emotional-drift",
        ],
        evergreen: [
          "vibe-evergreen-shine",
          "vibe-evergreen-bob",
          "vibe-evergreen-glow",
        ],
      };
      const VIBE_CLASSES = Object.values(VIBE_POOLS)
        .flat()
        .concat("vibe-chosen-pop");
      const VIBE_CLEANUP_MS = 3000; // longer than the longest vibe animation
      const vibeTimers = {};

      function clearVibe(slot) {
        if (vibeTimers[slot]) {
          clearTimeout(vibeTimers[slot]);
          vibeTimers[slot] = null;
        }
        const el = ticketEls[slot];
        if (el) el.classList.remove(...VIBE_CLASSES);
      }

      function scheduleVibe(slot, isFirst) {
        if (vibeTimers[slot]) clearTimeout(vibeTimers[slot]);
        const delay = isFirst
          ? 8000 + Math.random() * 22000 // first: 8-30s after showing
          : 24000 + Math.random() * 14000; // then: every 24-38s
        vibeTimers[slot] = setTimeout(() => triggerVibe(slot), delay);
      }

      function triggerVibe(slot) {
        const el = ticketEls[slot];
        if (
          !el ||
          !el.classList.contains("visible") ||
          el.classList.contains("locked")
        ) {
          return;
        }
        const vibe = el.dataset.vibe || slot;
        const pool = VIBE_POOLS[vibe] || VIBE_POOLS[slot];
        const cls = pool[Math.floor(Math.random() * pool.length)];
        el.classList.remove(...VIBE_CLASSES);
        void el.offsetWidth; // restart animation if the same class repeats
        el.classList.add(cls);
        setTimeout(() => el.classList.remove(cls), VIBE_CLEANUP_MS);
        scheduleVibe(slot, false);
      }

      function initTickets() {
        ["power", "emotional", "evergreen"].forEach((slot) => {
          const el = document.getElementById("ticket-" + slot);
          if (el) {
            ticketEls[slot] = el;
          }
        });
        hideAllTickets();
      }

      function hideAllTickets() {
        Object.keys(ticketEls).forEach((slot) => {
          clearVibe(slot);
          const el = ticketEls[slot];
          el.classList.remove("visible", "locked");
          el.classList.add("hidden");
          const titleEl = el.querySelector(".ticket-title");
          const artistEl = el.querySelector(".ticket-artist");
          if (titleEl) titleEl.textContent = "–";
          if (artistEl) artistEl.textContent = "–";
        });
      }

      function showOptions(payload) {
        const { power, emotional, evergreen } = payload || {};
        const bySlot = { power, emotional, evergreen };

        Object.entries(bySlot).forEach(([slot, song]) => {
          const el = ticketEls[slot];
          if (!el) return;

          el.classList.remove("locked", "hidden");
          clearVibe(slot);
          if (song) {
            const titleEl = el.querySelector(".ticket-title");
            const artistEl = el.querySelector(".ticket-artist");
            if (titleEl) titleEl.textContent = song.title || "";
            if (artistEl) artistEl.textContent = song.artist || "";
            el.dataset.vibe = song.category || slot;
            el.classList.add("visible");
            scheduleVibe(slot, true);
          } else {
            el.classList.remove("visible");
            el.classList.add("hidden");
          }
        });
      }

      function lockChoice(payload) {
        const { slot, song } = payload || {};
        if (!slot || !ticketEls[slot]) return;

        Object.entries(ticketEls).forEach(([key, el]) => {
          clearVibe(key);
          if (key === slot) {
            el.classList.add("locked");
            el.classList.remove("hidden");
            el.classList.add("visible");

            // If song details are provided, ensure the ticket text matches
            // the locked choice (works for both suggestion-based and
            // manually forced selections).
            if (song) {
              const titleEl = el.querySelector(".ticket-title");
              const artistEl = el.querySelector(".ticket-artist");
              if (titleEl) titleEl.textContent = song.title || "";
              if (artistEl) artistEl.textContent = song.artist || "";
              el.dataset.vibe = song.category || slot;
            }

            // Celebratory pop on lock-in; the ongoing pulse + shine
            // comes from the .locked styles.
            void el.offsetWidth;
            el.classList.add("vibe-chosen-pop");
            setTimeout(() => el.classList.remove("vibe-chosen-pop"), 800);
          } else {
            el.classList.remove("locked");
            el.classList.remove("visible");
            el.classList.add("hidden");
          }
        });

        // Optional: could play a sound effect here.
      }

      function playSong(payload) {
        const youtubeId = payload && payload.youtubeId;
        if (!youtubeId) return;

        // Hide tickets while song plays
        Object.keys(ticketEls).forEach((slot) => {
          clearVibe(slot);
          const el = ticketEls[slot];
          el.classList.remove("visible", "locked");
          el.classList.add("hidden");
        });

        if (playerReady && player && typeof player.loadVideoById === "function") {
          player.loadVideoById(youtubeId);
          player.playVideo();
        } else {
          pendingVideoId = youtubeId;
        }
      }

      function handleMessage(msg) {
        if (!msg || !msg.action) return;
        const action = msg.action;
        const payload = msg.payload || {};

        switch (action) {
          case "SHOW_OPTIONS":
            showOptions(payload);
            break;
          case "HIDE_OPTIONS":
            hideAllTickets();
            break;
          case "LOCK_CHOICE":
            lockChoice(payload);
            break;
          case "PLAY_SONG":
            playSong(payload);
            break;
          default:
            break;
        }
      }

      function setupKeyboard() {
        window.addEventListener("keydown", (ev) => {
          const key = ev.key;
          if (key === "1" || key === "2" || key === "3") {
            if (window.sendKaraokeMessage) {
              window.sendKaraokeMessage("AUDIENCE_KEY", { key });
            }
          }
        });
      }

      window.addEventListener("DOMContentLoaded", () => {
        initTickets();
        setupKeyboard();
        if (window.onKaraokeMessage) {
          window.onKaraokeMessage(handleMessage);
        }
      });
    </script>
  </body>
</html>
